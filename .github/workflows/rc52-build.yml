name: RC52 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Run upstream unit tests
        run: pio test -e native -e native_kiss_modem -vv

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - heltec_rc52_display_diagnostic

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Create RC52 diagnostic UF2
        run: pio run -e heltec_rc52_display_diagnostic -t create_uf2

      - name: Verify RC52 diagnostic UF2
        shell: bash
        run: |
          test -s .pio/build/heltec_rc52_display_diagnostic/firmware.hex
          test -s .pio/build/heltec_rc52_display_diagnostic/firmware.uf2
          test "$(($(stat -c%s .pio/build/heltec_rc52_display_diagnostic/firmware.uf2) % 512))" -eq 0
          python bin/uf2conv/uf2conv.py -i .pio/build/heltec_rc52_display_diagnostic/firmware.uf2 | tee .pio/build/heltec_rc52_display_diagnostic/uf2-info.txt
          grep -qi '0xada52840' .pio/build/heltec_rc52_display_diagnostic/uf2-info.txt
          grep -qi 'Target Address is 0x00026000' .pio/build/heltec_rc52_display_diagnostic/uf2-info.txt
          sha256sum \
            .pio/build/heltec_rc52_display_diagnostic/firmware.uf2 \
            .pio/build/heltec_rc52_display_diagnostic/firmware.hex \
            > .pio/build/heltec_rc52_display_diagnostic/SHA256SUMS

      - name: Upload exact RC52 diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RC52-Display-Diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            .pio/build/heltec_rc52_display_diagnostic/firmware.uf2
            .pio/build/heltec_rc52_display_diagnostic/firmware.hex
            .pio/build/heltec_rc52_display_diagnostic/SHA256SUMS
            .pio/build/heltec_rc52_display_diagnostic/uf2-info.txt
          retention-days: 14
