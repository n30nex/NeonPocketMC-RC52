name: RC52 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Run upstream unit tests
        run: pio test -e native -e native_kiss_modem -vv

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - heltec_rc52_companion_radio_ble
          - heltec_rc52_companion_radio_usb
          - Heltec_t114_companion_radio_ble

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Create RC52 application UF2
        if: startsWith(matrix.environment, 'heltec_rc52_companion_radio_')
        run: pio run -e ${{ matrix.environment }} -t create_uf2

      - name: Verify RC52 UF2
        if: startsWith(matrix.environment, 'heltec_rc52_companion_radio_')
        shell: bash
        run: |
          out=.pio/build/${{ matrix.environment }}
          test -s "$out/firmware.hex"
          test -s "$out/firmware.uf2"
          test "$(($(stat -c%s "$out/firmware.uf2") % 512))" -eq 0
          python bin/uf2conv/uf2conv.py -i "$out/firmware.uf2" | tee "$out/uf2-info.txt"
          grep -qi '0xada52840' "$out/uf2-info.txt"
          grep -qi 'Target Address is 0x00026000' "$out/uf2-info.txt"
          sha256sum \
            "$out/firmware.uf2" \
            "$out/firmware.hex" \
            > "$out/SHA256SUMS"

      - name: Upload exact RC52 application artifacts
        if: startsWith(matrix.environment, 'heltec_rc52_companion_radio_')
        uses: actions/upload-artifact@v4
        with:
          name: NeonPocketMC-RC52-${{ matrix.environment }}-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            .pio/build/${{ matrix.environment }}/firmware.uf2
            .pio/build/${{ matrix.environment }}/firmware.hex
            .pio/build/${{ matrix.environment }}/SHA256SUMS
            .pio/build/${{ matrix.environment }}/uf2-info.txt
          retention-days: 14
