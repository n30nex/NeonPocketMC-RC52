[Heltec_rc52]
extends = nrf52_base
board = heltec_rc52
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${nrf52_base.build_flags}
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -I variants/heltec_rc52
  -I src/helpers/ui
  -D HELTEC_RC52=1
  -D NRF52_POWER_MANAGEMENT=1
  -D P_LORA_DIO_1=11
  -D P_LORA_NSS=13
  -D P_LORA_RESET=32
  -D P_LORA_BUSY=24
  -D P_LORA_SCLK=25
  -D P_LORA_MISO=14
  -D P_LORA_MOSI=22
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_RXEN=39
  -D PIN_USER_BTN=42
  -D PIN_TFT_SCL=30
  -D PIN_TFT_SDA=34
  -D PIN_TFT_MISO=12
  -D PIN_TFT_CS=36
  -D PIN_TFT_DC=28
  -D PIN_TFT_RST=10
  -D PIN_TFT_EN=45
  -D PIN_TFT_BL=9
  -D PIN_TFT_EN_ACTIVE=LOW
  -D PIN_TFT_BL_ACTIVE=HIGH
  -D SPI_FREQUENCY=8000000
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<helpers/ui/NV3001BDisplay.cpp>
  +<../variants/heltec_rc52>
lib_deps =
  ${nrf52_base.lib_deps}
debug_tool = jlink
upload_protocol = nrfutil

[env:heltec_rc52_companion_radio_ble]
extends = Heltec_rc52
build_flags =
  ${Heltec_rc52.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=NV3001BDisplay
  -D DISPLAY_REQUIRED=1
  -D NEONPOCKET_UI=1
  -D NEONPOCKET_MEMORY_GATE_BYTES=16384
  -D RC52_STARTUP_DIAGNOSTICS=1
  -D NV3001B_USE_FRAMEBUFFER=1
  -D NV3001B_LOGICAL_WIDTH=220
  -D NV3001B_LOGICAL_HEIGHT=128
  -D NV3001B_SCREEN_WIDTH=220
  -D NV3001B_SCREEN_HEIGHT=128
  -D DISPLAY_ROTATION=0
  -D AUTO_OFF_MILLIS=60000
  -D MAX_CONTACTS=200
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=128
build_src_filter = ${Heltec_rc52.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_rc52.lib_deps}
  densaugeo/base64 @ ~1.4.0
